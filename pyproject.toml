[project]
name = "naver-content-os"
version = "0.1.0"
description = "Naver Content OS V1 - local-first keyword intelligence and SmartEditor draft pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "playwright>=1.47",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "python/providers",
    "python/intelligence",
    "python/planner",
    "python/publisher",
    "apps/local-core/app",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: hits real external APIs, requires credentials in .env",
]
addopts = "-m 'not smoke'"
